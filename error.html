<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error — Adrian Dabrowski</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { tiffany: '#81D8D0' },
        fontFamily: { sans: ['Inter', 'sans-serif'] },
      },
    },
  };
</script>
<style>
  * { -ms-overflow-style: none; scrollbar-width: none; }
  *::-webkit-scrollbar { width: 0px; background: transparent; }
  html { scroll-behavior: smooth; }
  body { background-color: #000000; font-family: 'Inter', sans-serif; color: #ffffff; }
  ::selection { background-color: #81D8D0; color: #000000; }
  ::-moz-selection { background-color: #81D8D0; color: #000000; }

  .ios-glass {
    background: rgba(30, 30, 30, 0.4);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(20px) scale(0.98); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .fade-in-el {
    opacity: 0;
    animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .card-transition {
    transition: background-color 400ms cubic-bezier(0.16, 1, 0.3, 1),
                transform 400ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
  .animate-ping-slow { animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
</style>
</head>
<body class="antialiased overflow-x-hidden">

  <!-- BACKGROUND LAYER -->
  <div class="fixed inset-0 z-0 pointer-events-none">
    <div class="absolute -top-40 -left-40 w-[600px] h-[600px] rounded-full bg-tiffany opacity-[0.07] blur-[120px] mix-blend-screen"></div>
    <div class="absolute -bottom-40 -right-40 w-[500px] h-[500px] rounded-full bg-blue-900 opacity-10 blur-[120px] mix-blend-screen"></div>
  </div>

  <!-- NAV -->
  <nav class="fixed top-6 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-md">
    <div class="ios-glass rounded-full px-2 py-2 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 pl-3">
        <span class="w-7 h-7 rounded-full bg-tiffany flex items-center justify-center text-black text-[11px] font-semibold">AD</span>
      </a>
      <a href="index.html" class="bg-tiffany text-black text-sm font-medium px-5 py-2 rounded-full hover:opacity-90 transition-opacity duration-300">
        Home
      </a>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="relative z-10 min-h-screen flex items-center justify-center px-6">
    <div class="max-w-lg w-full text-center fade-in-el">

      <div id="status-badge" class="inline-flex items-center gap-2 ios-glass rounded-full pl-2.5 pr-4 py-1.5 mb-10">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping-slow absolute inline-flex h-full w-full rounded-full bg-tiffany opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-tiffany"></span>
        </span>
        <span id="badge-text" class="text-xs text-white/70">Something went wrong</span>
      </div>

      <h1 id="error-code" class="text-[100px] sm:text-[140px] leading-none tracking-tight font-semibold bg-gradient-to-b from-white to-white/50 bg-clip-text text-transparent">
        404
      </h1>

      <h2 id="error-title" class="text-2xl md:text-3xl font-medium tracking-tight mt-4">
        Page not found
      </h2>

      <p id="error-desc" class="text-white/50 font-light mt-4 leading-relaxed max-w-sm mx-auto">
        The page you're looking for doesn't exist, was moved, or the link is broken.
      </p>

      <div class="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4">
        <a href="index.html" class="inline-flex items-center gap-2 bg-white text-black text-sm font-medium px-6 py-3.5 rounded-full hover:bg-white/90 transition-colors duration-300">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          Back to Home
        </a>
        <a href="index.html#contact" class="inline-flex items-center gap-2 ios-glass card-transition text-white text-sm font-medium px-6 py-3.5 rounded-full hover:bg-white/5">
          Contact me
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </a>
      </div>

      <div class="mt-16 pt-8 border-t border-white/10">
        <p class="text-[10px] uppercase tracking-widest text-white/40">Designed in California</p>
      </div>

    </div>
  </main>

<script>
  const ERRORS = {
    '400': {
      badge: 'Bad request',
      title: 'Bad request',
      desc: 'The request could not be understood. Check the URL and try again.',
    },
    '401': {
      badge: 'Authentication required',
      title: 'Unauthorized',
      desc: 'You need to sign in to view this page.',
    },
    '403': {
      badge: 'Access restricted',
      title: 'Forbidden',
      desc: 'You don\u2019t have permission to view this page.',
    },
    '404': {
      badge: 'Something went wrong',
      title: 'Page not found',
      desc: 'The page you\u2019re looking for doesn\u2019t exist, was moved, or the link is broken.',
    },
    '408': {
      badge: 'Timed out',
      title: 'Request timeout',
      desc: 'The server took too long to respond. Please try again.',
    },
    '500': {
      badge: 'Server error',
      title: 'Something broke on our end',
      desc: 'An unexpected error occurred. It\u2019s been logged — please try again shortly.',
    },
    '503': {
      badge: 'Unavailable',
      title: 'Service unavailable',
      desc: 'This page is temporarily down for maintenance. Check back soon.',
    },
  };

  function loadError() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || '404';
    const data = ERRORS[code] || ERRORS['404'];

    document.getElementById('error-code').textContent = code;
    document.getElementById('badge-text').textContent = data.badge;
    document.getElementById('error-title').textContent = data.title;
    document.getElementById('error-desc').textContent = data.desc;
    document.title = code + ' — ' + data.title + ' — Adrian Dabrowski';
  }

  loadError();
  lucide.createIcons();
</script>

</body>
</html>
